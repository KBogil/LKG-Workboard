<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKG Workboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 잠금 화면: 어두운 배경 위에 로고와 입력칸이 든 카드 하나를 가운데 놓습니다. -->
<div class="lock-overlay" id="lockOverlay">
  <!-- 배경 장식. 내용이 아니므로 화면 낭독기에서는 건너뜁니다. -->
  <div class="lock-bg" aria-hidden="true">
    <span class="lock-glow lock-glow-a"></span>
    <span class="lock-glow lock-glow-b"></span>
  </div>

  <div class="lock-card">
    <img id="introImg" class="lock-logo" src="./intro.png" alt="LINKAGE LAB" />

    <div class="lock-box">
      <h2>LKG Workboard</h2>
      <p>비밀번호를 입력하면 대시보드가 열립니다.</p>

      <!-- 브라우저·비밀번호 관리자가 저장할 수 있게 해둡니다.
           긴 비밀번호를 매번 타이핑하지 않아도 되도록 하기 위한 것입니다.

           처음에는 잠가 둡니다(disabled).
           데이터 파일이 약 4MB라 받는 데 0.5~2초가 걸리는데, 예전에는 이 입력칸이
           열려 있어서 빨리 입력하고 Enter를 치면 아직 파일이 없는 상태로 복호화를
           시도했습니다. 그러면 예외가 나서 "비밀번호가 올바르지 않습니다"가
           잘못 떴습니다(맞는 비밀번호인데도).
           app.js 의 init() 이 파일을 다 받은 뒤에만 풀어 줍니다. -->
      <input type="password" id="pinInput" name="workboard-password"
             placeholder="데이터 준비 중…" autocomplete="current-password" disabled />

      <!-- 버튼 글자를 span 으로 감싼 이유:
           확인을 누른 뒤 3~10초가 걸리므로(PBKDF2 60만 회 + 4MB 복호화)
           그동안 글자를 "확인 중…" → "데이터를 여는 중입니다" 로 바꿔서
           멈춘 게 아니라는 것을 알립니다. 회전 표시만 두지 않고 글자를 같이 바꾸는 것은
           색·움직임만으로 정보를 전달하지 않기 위해서입니다. -->
      <button id="pinSubmit" disabled>
        <span class="pin-spinner" id="pinSpinner" aria-hidden="true" hidden></span>
        <span id="pinSubmitLabel">확인</span>
      </button>

      <p class="lock-error" id="lockError"></p>
    </div>
  </div>

  <p class="lock-footer">전산 · 탕비실 · 소모품 · 법인차량 · 메일룸 · 플랜트박스 관리 현황</p>
</div>

<div class="app" id="appRoot" style="display:none;">

  <!-- 사이드바 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="hamburger" id="hamburgerBtn" aria-label="메뉴 열기/닫기">
        <span></span><span></span><span></span>
      </button>
      <span class="brand">LKG Workboard</span>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-view="overview">
        <span class="nav-icon">▦</span><span class="nav-label">개요</span>
      </button>
      <button class="nav-item" data-view="jeonsan">
        <span class="nav-icon">🖥</span><span class="nav-label">전산 관리</span>
      </button>
      <button class="nav-item" data-view="tangbisil">
        <span class="nav-icon">☕</span><span class="nav-label">탕비실 관리</span>
      </button>
      <button class="nav-item" data-view="somopum">
        <span class="nav-icon">📦</span><span class="nav-label">소모품 관리</span>
      </button>
      <button class="nav-item" data-view="vehicle">
        <span class="nav-icon">🚗</span><span class="nav-label">법인차량 관리</span>
      </button>
      <button class="nav-item" data-view="mail">
        <span class="nav-icon">✉</span><span class="nav-label">메일룸 관리</span>
      </button>
      <button class="nav-item" data-view="plant">
        <span class="nav-icon">🪴</span><span class="nav-label">플랜트박스 관리</span>
      </button>

      <hr class="nav-divider" />

      <button class="nav-item" data-view="annual">
        <span class="nav-icon">📊</span><span class="nav-label">연간 통계</span>
      </button>

      <!-- 관리자 알림. 개수 배지는 잠금과 상관없이 항상 보입니다. -->
      <button class="nav-item nav-admin" data-view="admin">
        <span class="nav-icon">🔔</span><span class="nav-label">관리자 알림</span>
        <span class="nav-badge" id="adminBadge" hidden>0</span>
      </button>
    </nav>

    <div class="sidebar-footer" id="lastUpdated">업데이트 확인 중...</div>
  </aside>

  <!-- 본문 -->
  <main class="main">
    <header class="topbar">
      <h1 id="pageTitle">개요</h1>
      <!-- 화면을 보는 중에 새 데이터가 올라오면 여기에 뜹니다. -->
      <button class="refresh-pill" id="refreshPill" hidden>새 데이터가 있습니다 · 지금 보기</button>
    </header>

    <section class="content" id="content">
      <p class="loading">데이터를 불러오는 중입니다...</p>
    </section>
  </main>

</div>

<!-- 상세 내용 팝업. 표의 행이나 담당자 카드를 누르면 여기에 내용이 채워집니다. -->
<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <h2 id="modalTitle"></h2>
      <button class="modal-close" id="modalClose" aria-label="닫기">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
