name: Sync Google Sheets to JSON

on:
  schedule:
    # 30분마다 자동 실행 (UTC 기준 시간이라 한국시간과 9시간 차이납니다)
    - cron: '*/30 * * * *'
  # 이 버튼을 누르면 수동으로도 즉시 실행할 수 있습니다 (Actions 탭 > Run workflow)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 구글 시트 -> JSON 변환 실행
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          WORKBOARD_PIN: ${{ secrets.WORKBOARD_PIN }}
        run: python scripts/sync_sheets.py

      - name: 변경된 내용이 있으면 저장소에 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/workboard.json
          git diff --staged --quiet || git commit -m "자동 업데이트: workboard 데이터 갱신"
          git push
